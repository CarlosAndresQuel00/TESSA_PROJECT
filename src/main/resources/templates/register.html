<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; }
        .container { width: 300px; margin: 100px auto; padding: 20px; background: #fff; border-radius: 5px; }
        h2 { text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; }
        button { width: 100%; padding: 10px; background: #28a745; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
<div class="container">
    <h2>Create Account</h2>
    <form th:action="@{/auth/register-user}" method="post">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required/>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required/>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirmPassword" required/>
        </div>
        <button type="submit">Register</button>
    </form>
    <div style="margin-top:10px; text-align:center;">
        <a th:href="@{/login-page}">Back to Login</a>
    </div>
</div>
</body>
</html>
